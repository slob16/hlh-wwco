<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Wags &amp; Whiskers Co.</title>
    <meta name="description" content="Welcome to The Wags &amp; Whiskers Co.">
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/brand/favicon.png">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/contact-popups.css">
    <script src="assets/js/contact-popups.js" defer></script>
    <script src="assets/js/critters.js" defer></script>
    <link rel="stylesheet" href="assets/css/landing.css">
  </head>
  <body class="landing-page">
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute;">
      <defs>
        <filter id="logo-edge-clarity" color-interpolation-filters="sRGB">
          <feComponentTransfer>
            <feFuncA type="linear" slope="1.5" intercept="-0.25"/>
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>
    <main class="landing-hero" aria-label="Welcome to The Wags &amp; Whiskers Co.">
      <img class="landing-hero__corner-whiskers" src="assets/brand/whiskers.svg" alt="" aria-hidden="true" width="122" height="33">
      <div class="critters" aria-hidden="true">
        <div class="critter critter--bichon" data-critter="bichon">
          <div class="critter__window"><img class="critter__art" src="assets/illustrations/dog-bichon.svg" alt="" width="254" height="258"></div>
        </div>
      </div>
      <div class="landing-hero__content">
        <img class="landing-hero__logo" src="assets/brand/logo.png"
          alt="The Wags &amp; Whiskers Co." width="500" height="500">
        <p class="landing-hero__intro">I’m Hannah, the heart behind The&nbsp;Wags&nbsp;&amp;&nbsp;Whiskers&nbsp;Co – a loving, reliable and dedicated companion for your pets when you can’t be there.</p>
        <div class="landing-hero__contact" aria-label="Contact us">
          <button class="contact-icon" type="button" data-contact="phone" aria-label="Call us" aria-expanded="false" aria-controls="contact-popup" aria-haspopup="dialog">
            <img src="assets/icons/lucide/phone.svg" width="22" height="22" alt="">
            <span class="contact-icon__label">Call us</span>
          </button>
          <button class="contact-icon" type="button" data-contact="whatsapp" aria-label="WhatsApp" aria-expanded="false" aria-controls="contact-popup" aria-haspopup="dialog">
            <img src="assets/icons/socials/whatsapp.svg" width="21" height="21" alt="">
            <span class="contact-icon__label">WhatsApp</span>
          </button>
          <button class="contact-icon" type="button" data-contact="email" aria-label="Email us" aria-expanded="false" aria-controls="contact-popup" aria-haspopup="dialog">
            <img src="assets/icons/lucide/mail.svg" width="22" height="22" alt="">
            <span class="contact-icon__label">Email us</span>
          </button>
          <button class="contact-icon" type="button" data-contact="facebook" aria-label="Facebook" aria-expanded="false" aria-controls="contact-popup" aria-haspopup="dialog">
            <img src="assets/icons/socials/facebook.svg" width="20" height="20" alt="">
            <span class="contact-icon__label">Facebook</span>
          </button>
          <button class="contact-icon" type="button" data-contact="instagram" aria-label="Instagram" aria-expanded="false" aria-controls="contact-popup" aria-haspopup="dialog">
            <img src="assets/icons/socials/instagram.svg" width="20" height="20" alt="">
            <span class="contact-icon__label">Instagram</span>
          </button>
          <button class="contact-icon" type="button" data-contact="tiktok" aria-label="TikTok" aria-expanded="false" aria-controls="contact-popup" aria-haspopup="dialog">
            <img src="assets/icons/socials/tiktok.svg" width="22" height="22" alt="">
            <span class="contact-icon__label">TikTok</span>
          </button>
        </div>
        <p class="landing-hero__coming-soon">Website Coming Soon</p>
      </div>
    </main>
    <aside id="contact-popup" class="pet-popup" role="dialog" aria-labelledby="contact-popup-title" hidden>
      <button class="pet-popup__close" type="button" aria-label="Close contact pop-up">
        <span class="pet-popup__close-icon" aria-hidden="true"></span>
      </button>
      <div class="pet-popup__content">
        <h2 id="contact-popup-title">Call Hannah</h2>
        <p id="contact-popup-detail">Details coming soon</p>
        <a id="contact-popup-link" hidden></a>
      </div>
    </aside>
  </body>
</html>
